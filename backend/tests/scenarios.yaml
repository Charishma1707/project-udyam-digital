# tests/scenarios.yaml
# Predefined test scenarios for the Airtel Business Recommendation Engine
# Covers edge cases, compliance, toggles, constraints, and diversity

scenarios:
  - id: "SC-01"
    name: "No GSTIN Micro Retail"
    profile:
      business_type: "Kirana Store"
      city: "Lucknow"
      city_tier: 2
      employee_count: 3
      num_sites: 1
      has_gstin: "N"
      needs: ["Internet"]
    expected:
      ready: true
      gstin_valid_for_sale: false
      no_gstin_products_in_options: true

  - id: "SC-02"
    name: "Cancelled GSTIN Tax Block"
    profile:
      business_type: "Textile Shop"
      city: "Surat"
      city_tier: 2
      employee_count: 8
      num_sites: 1
      gstin: "27AAACW1234A1Z5" # Cancelled in registry
      needs: ["Internet", "WhatsApp"]
    expected:
      ready: true
      gstin_valid_for_sale: false
      blocks_gstin_products: true

  - id: "SC-03"
    name: "Tier-2 City Connectivity"
    profile:
      business_type: "Medical Store"
      city: "Kanpur"
      city_tier: 2
      employee_count: 4
      num_sites: 1
      has_gstin: "Y"
      needs: ["Internet", "Billing"]
    expected:
      ready: true
      tier_match_only: [1, 2]

  - id: "SC-04"
    name: "Single-Site Micro Office"
    profile:
      business_type: "CA Office"
      city: "Bengaluru"
      city_tier: 1
      employee_count: 5
      num_sites: 1
      has_gstin: "Y"
      needs: ["WiFi", "Email"]
    expected:
      ready: true
      min_sites: 1

  - id: "SC-05"
    name: "Multi-Site Retail with CCTV"
    profile:
      business_type: "Supermarket Chain"
      city: "Delhi"
      city_tier: 1
      employee_count: 20
      num_sites: 4
      has_gstin: "Y"
      needs: ["CCTV", "WiFi"]
    expected:
      ready: true
      auto_adds_broadband_for_cctv: true

  - id: "SC-06"
