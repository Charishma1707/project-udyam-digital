<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtel Business - PostgreSQL Database Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B1120;
      --bg-card: #111827;
      --border-color: rgba(255, 255, 255, 0.08);
      --airtel-red: #E11D48;
      --accent-cyan: #38BDF8;
      --accent-emerald: #10B981;
      --accent-purple: #A855F7;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 24px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .badge {
      background: var(--airtel-red);
      color: white;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
    }
    .title { font-size: 1.35rem; font-weight: 800; }
    .nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tabs-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: white; }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: 700;
    }
    .info-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.8rem;
    }
    .search-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      width: 280px;
    }
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
      max-height: 70vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      text-align: left;
    }
    th {
      background: rgba(30, 41, 59, 0.9);
      padding: 10px 14px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #E2E8F0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
    }
    tr:hover { background: rgba(255, 255, 255, 0.03); }
    .status-pill {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
    }
    .pill-green { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }
    .pill-red { background: rgba(225, 29, 72, 0.15); color: var(--airtel-red); }
    .pill-blue { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="badge">POSTGRESQL</span>
      <div>
        <div class="title">🗄️ Database Table Explorer</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Database: airtel_udyam_db · Schema: public · 11,320 Records</div>
      </div>
    </div>
    <div style="display: flex; gap: 10px;">
      <a href="/" class="nav-btn">← Back to Conversational AI Assistant</a>
    </div>
  </div>

  <div class="tabs-bar" id="tabs">
    <button class="tab-btn active" onclick="switchTable('product_catalogue')">📦 product_catalogue (25)</button>
    <button class="tab-btn" onclick="switchTable('city_tier_mapping')">🏙️ city_tier_mapping (38)</button>
    <button class="tab-btn" onclick="switchTable('gstin_registry')">🏢 gstin_registry (3,534)</button>
    <button class="tab-btn" onclick="switchTable('udyam_registry')">📜 udyam_registry (2,723)</button>
    <button class="tab-btn" onclick="switchTable('smb_leads')">👥 smb_leads (5,000)</button>
    <button class="tab-btn" onclick="switchTable('bundle_statistics')">📊 bundle_statistics</button>
    <button class="tab-btn" onclick="switchTable('product_statistics')">📈 product_statistics</button>
  </div>

  <div class="info-bar">
    <div id="table-info">Loading table records...</div>
    <input type="text" id="search" class="search-input" placeholder="Search in this table..." oninput="handleSearch(this.value)">
  </div>

  <div class="table-container">
    <table id="data-table">
      <thead><tr id="table-head"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    let currentTable = 'product_catalogue';
    let currentData = [];

    async function loadTable(name) {
      document.getElementById('table-body').innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 24px; color: #94A3B8;">Loading data from database...</td></tr>';
      try {
        const res = await fetch(`/api/database/table/${name}`);
        const json = await res.json();
        currentData = json.rows || [];
        renderTable(currentData);
        document.getElementById('table-info').innerHTML = `Viewing <strong>${currentData.length}</strong> records in <code>${name}</code> (Source: ${json.source || 'Database'})`;
      } catch (e) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="10" style="color: #E11D48; padding: 20px;">Error loading table: ${e.message}</td></tr>`;
      }
    }

    function renderTable(rows) {
      if (!rows || rows.length === 0) {
        document.getElementById('table-head').innerHTML = '';
        document.getElementById('table-body').innerHTML = '<tr><td style="text-align: center; padding: 24px; color: #94A3B8;">No records found.</td></tr>';
        return;
      }

      const cols = Object.keys(rows[0]);
      document.getElementById('table-head').innerHTML = cols.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('');

      document.getElementById('table-body').innerHTML = rows.slice(0, 200).map(r => {
        return '<tr>' + cols.map(c => {
          let val = r[c];
          if (val === null || val === undefined) return '<td style="color: #64748B;">null</td>';
          if (Array.isArray(val)) return `<td><span class="status-pill pill-blue">${val.join(', ')}</span></td>`;
          if (typeof val === 'boolean') {
            return `<td><span class="status-pill ${val ? 'pill-green' : 'pill-red'}">${val ? 'YES' : 'NO'}</span></td>`;
          }
          return `<td>${String(val)}</td>`;
        }).join('') + '</tr>';
      }).join('');
    }

    function switchTable(name) {
      currentTable = name;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('search').value = '';
      loadTable(name);
    }

    function handleSearch(q) {
      const term = q.trim().toLowerCase();
      if (!term) {
        renderTable(currentData);
        return;
      }
      const filtered = currentData.filter(r => {
        return Object.values(r).some(v => String(v).toLowerCase().includes(term));
      });
      renderTable(filtered);
      document.getElementById('table-info').innerHTML = `Showing <strong>${filtered.length}</strong> matches of ${currentData.length} in <code>${currentTable}</code>`;
    }

    // Initial load
    loadTable('product_catalogue');
  </script>
</body>
</html>
